# Fully automated release: pushing a v* tag builds from source, packs the
# plugin tarball, and creates the GitHub Release with auto-generated notes
# and the tgz attached. A release is therefore: bump package.json, commit,
# tag, push the tag.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - name: Create the release and attach the tarball
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dsh-models-radar-*.tgz
